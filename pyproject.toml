[project]
name = "shopify-radar"
version = "0.1.0"
description = "Dashboard nội bộ theo dõi thay đổi nền tảng Shopify, social và web cho team theme/app"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.14,<2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "feedparser>=6.0",
    "requests>=2.31",
    "yt-dlp[default]>=2026.7.4",
    "apscheduler>=3.10,<4",
    "mcp>=2.2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
radar = "radar.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["radar*", "api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
