# Shopify Radar — nguồn dữ liệu và tham số chạy
# Giai đoạn 2: khi file này được sửa trên trang Cài đặt, bản trong DB sẽ thay cho file này.
# Chủ đề ưu tiên (vd. Shopify Canvas) nằm ở priorities.txt; chúng được tìm thêm trên mọi nguồn
# có "queries". Đặt priority_search: false ở một nguồn để không tìm thêm ở nguồn đó.

schedule:
  # cron theo múi giờ RADAR_TIMEZONE (mặc định Asia/Ho_Chi_Minh)
  collect: "7 */2 * * *"          # thu thập + phân loại + nghe video + chấm điểm, mỗi 2 giờ
  weekly_report: "52 7 * * 1"     # báo cáo tuần, sáng thứ Hai
  retention_days: 180             # xóa item cũ hơn số ngày này (0 = giữ mãi)

official:
  # Tin từ Shopify: luôn thu thập trước, luôn là bản được giữ khi trùng, xếp trước và là căn cứ
  # chính khi AI phân loại. Mọi nguồn "platform" là chính thức; nguồn khác (web search…) tính là
  # chính thức khi trang nằm trên các domain dưới đây. Một nguồn đặt official: true/false để ghi đè.
  domains: [shopify.dev, shopify.com, shopify.engineering, shopifystatus.com, github.com/Shopify]
  exclude: [community.shopify.com, apps.shopify.com]   # diễn đàn và trang app: người dùng viết

freshness:
  # Chỉ lấy thông tin mới: bỏ bài/video đăng trước số ngày này (0 = không giới hạn).
  # Từng nguồn có thể đặt max_age_days riêng. Item cũ đã lưu cũng bị xóa ở lần chạy sau,
  # trừ item đang có người xử lý ("Đang làm"/"Xong").
  max_age_days: 30

ai:
  model: claude-haiku-5-5          # mọi bước AI (phân loại, tóm tắt video, cộng đồng, báo cáo tuần)
  # effort: low | medium | high | xhigh | max (cao hơn = kỹ hơn, tốn token hơn)
  classify_effort: high           # phân loại tin và tạo tag
  summarize_effort: high          # tóm tắt video YouTube
  report_effort: high             # báo cáo tuần
  batch_size: 20                  # số item mỗi lần gọi Claude khi phân loại (lô bị cắt vì quá dài sẽ tự chia đôi)
  classify_max_tokens: 16000      # độ dài tối đa câu trả lời mỗi lô; giữ ≤ 16000 (gọi không streaming, tránh timeout)
  max_items_per_run: 400          # trần số item gửi Claude mỗi lần chạy
  content_chars: 500              # cắt nội dung mỗi item khi gửi phân loại
  min_score: 0.5                  # điểm liên quan tối thiểu (0..1) để coi là khớp
  reclassify_threshold: 0.6       # file chủ đề đổi nhiều hơn mức này thì phân loại lại toàn bộ
  reclassify_days: 14             # khi phân loại lại toàn bộ, chỉ lấy item trong N ngày
  use_batch_api: false            # true = gửi phân loại qua Message Batches API (rẻ hơn 50%, chậm hơn)
  fallbacks: true                 # khi Claude từ chối, tự chạy lại bằng model khác (chỉ Opus 5.5, Opus 5, Sonnet 5.5, Fable 5.1 hỗ trợ; Haiku tự bỏ qua)
  report_max_items: 150
  # Giá USD mỗi triệu token, dùng để tính chi phí trên trang Chi phí
  pricing:
    claude-opus-5-5: {input: 4.0, output: 20.0, cache_read: 0.2, cache_write: 5.0}
    claude-sonnet-5-5: {input: 2.0, output: 10.0, cache_read: 0.2, cache_write: 2.5}
    claude-haiku-5-5: {input: 0.1, output: 0.5, cache_read: 0.01, cache_write: 0.125}

community:
  # Trang "Thảo luận cộng đồng" (nguồn kind: community — Discord, Shopify Community)
  # Mỗi bản tóm tắt chỉ gồm tin MỚI so với bản trước (không lặp lại), tối đa digest_hours giờ gần nhất.
  digest_hours: 24                # không tóm tắt tin cũ hơn chừng này giờ
  digest_every_hours: 6           # viết bản tóm tắt mới tối đa mỗi chừng này giờ (24 = mỗi ngày một bản gồm cả ngày)
  digest_effort: high             # tóm tắt thảo luận
  summary_effort: high            # tóm tắt từng chủ đề Shopify Community
  translate_effort: high          # dịch từng tin Discord sang tiếng Việt
  describe_images: true           # Claude xem ảnh đính kèm trong tin Discord và mô tả bằng tiếng Việt
  max_images_per_run: 40          # tối đa số tin có ảnh được xem mỗi lượt
  max_chars: 80000                # giới hạn độ dài tin gửi Claude cho mỗi bản tóm tắt

video:
  min_score: 0.5                  # chỉ nghe video có điểm liên quan sơ bộ ≥ mức này
  max_minutes: 60
  max_per_run: 10
  subtitle_langs: [en, vi]       # chỉ tải 1 ngôn ngữ đầu tiên có sẵn (tải nhiều dễ bị YouTube chặn 429)
  groq_model: whisper-large-v3-turbo
  chunk_seconds: 600

scoring:
  weights: {relevance: 0.5, engagement: 0.2, cross_source: 0.15, recency: 0.15}
  recency_half_life_hours: 48
  hot_threshold: 5.0              # độ hot ≥ mức này (trong 48 giờ) = chế độ "Đang nổi" ở Feed
  hot_half_life_hours: 24         # "độ hot" (Feed xếp theo) giảm một nửa sau mỗi chừng này giờ kể từ khi đăng
  priority_boost: 2.0
  official_boost: 1.0             # cộng thêm cho tin từ nguồn chính thức của Shopify (tối đa 10)             # cộng thêm cho item nhắc tới chủ đề trong priorities.txt (tối đa 10)

sources:
  # ── Nền tảng ────────────────────────────────────────────────
  - id: shopify-dev-changelog
    name: Shopify dev changelog
    type: rss
    kind: platform
    urls: ["https://shopify.dev/changelog/feed.xml"]
    expected_domain: shopify.dev
    media_type: change
    release_notes: true           # thay đổi đã phát hành: được đưa vào "Cần xử lý" ở Tổng quan

  - id: shopify-changelog
    name: Shopify Changelog
    type: rss
    kind: platform
    urls: ["https://changelog.shopify.com/feed.xml", "https://changelog.shopify.com/rss"]
    page_fallback: "https://changelog.shopify.com/"   # không có RSS thì đọc trang qua Jina Reader
    expected_domain: shopify.com
    media_type: change
    release_notes: true

  - id: shopify-editions
    name: Shopify Editions
    type: editions
    kind: platform
    url: "https://www.shopify.com/editions"
    max_age_days: 0               # luôn là Edition mới nhất, trang không ghi ngày từng tính năng
    media_type: change
    release_notes: true

  # Tắt: news.shopify.com là tin doanh nghiệp (kết quả kinh doanh, đối tác, sự kiện), hầu như không có
  # thay đổi kỹ thuật cho theme; URL RSS cũng chưa được xác nhận. Bật lên nếu team muốn theo dõi.
  - id: shopify-news
    name: Shopify news
    type: rss
    kind: platform
    urls: ["https://news.shopify.com/rss"]
    media_type: article
    enabled: false

  - id: github-releases
    name: GitHub releases
    type: github_releases
    kind: platform
    repos: ["Shopify/dawn", "Shopify/theme-tools", "Shopify/cli"]   # theme mẫu, Theme Check/Liquid tools, CLI (lệnh theme)
    media_type: release

  # ── Social ─────────────────────────────────────────────────
  - id: reddit
    name: Reddit
    type: reddit
    kind: social
    backends: [rdt-cli, exa]      # thứ tự ưu tiên; rdt-cli cần cookie tài khoản riêng
    subreddits: [shopify, shopifydev, ecommerce]
    queries: ["shopify theme", "shopify liquid", "theme editor"]
    limit: 25

  # Tài khoản chính thức trên X. Đặt trước nguồn "twitter" để bài chính thức được giữ, kết quả
  # tìm kiếm trùng sẽ gộp vào. Các tài khoản đăng lại bài của nhau: retweet, cùng nội dung hoặc
  # cùng link chỉ giữ một bài (ghi "đăng bởi" các tài khoản); tweet chỉ trỏ tới bài changelog,
  # Editions… đã có thì gắn vào bài đó, không tạo dòng mới.
  - id: x-official
    name: Shopify trên X
    type: x_accounts
    kind: platform
    backends: [twitter-cli]
    accounts: [ShopifyDevs, ShopifyEng, Shopify]   # thứ tự ưu tiên khi cùng một bài
    limit: 20
    dedupe_links: true
    dedupe_text: true
    media_type: post

  - id: twitter
    name: X/Twitter
    type: twitter
    kind: social
    backends: [twitter-cli]
    queries: ["shopify theme", "shopify liquid", "\"theme store\" shopify"]
    limit: 30

  # ── Thảo luận cộng đồng (menu riêng) ─────────────────────────
  # kind: community → không chấm điểm hay phân loại từng tin; trang "Thảo luận cộng đồng" tóm tắt
  # bằng tiếng Việt những gì mọi người bàn trong 24 giờ qua, và tóm tắt từng chủ đề Community.
  - id: shopify-community
    name: Shopify Community
    type: community
    kind: community
    keyword_filter: false         # lấy hết, không lọc từ khóa: mục đích là theo dõi mọi người bàn gì
    max_age_days: 7
    backends: [rss, jina]
    urls: ["https://community.shopify.com/latest.rss"]
    page_url: "https://community.shopify.com/latest"
    expected_domain: shopify.com

  # Discord đọc bằng discord-cli với TÀI KHOẢN RIÊNG CỦA RADAR (DISCORD_TOKEN trong .env).
  # Tài khoản này vào server cộng đồng như một thành viên. Discord không cho phép tự động hóa bằng
  # tài khoản thường và có thể khóa tài khoản: chỉ đọc, ít kênh, mỗi 2 giờ.
  - id: discord
    name: Discord
    type: discord
    kind: community
    backends: [discord-cli]
    keyword_filter: false
    max_age_days: 7
    limit: 300                    # tin tối đa mỗi kênh mỗi lần
    # Dán link kênh (chuột phải vào kênh → Copy Link) hoặc ID kênh. Link có dạng
    # https://discord.com/channels/<ID server>/<ID kênh>: radar lấy ID kênh (số thứ hai).
    # Tên hiển thị lấy theo tên thật của kênh trên Discord; `name` chỉ dùng khi không đọc được tên đó.
    channels: []                  # ví dụ: - "https://discord.com/channels/111/222"

  - id: youtube
    name: YouTube
    type: youtube
    kind: social
    backends: [yt-dlp]
    keyword_filter: false         # tiêu đề video ít thông tin: gửi thẳng cho Claude chấm sơ bộ
    drop_undated: true            # video không rõ ngày đăng thì bỏ (có thể là video nhiều năm trước)
    queries: ["shopify theme review", "shopify theme development", "shopify theme customization"]
    limit: 10

  # ── Web ───────────────────────────────────────────────────
  - id: web-search
    name: Web search
    type: web_search
    kind: web
    backends: [exa]
    queries:
      - "best shopify theme for"
      - "shopify theme store requirements"
      - "shopify theme performance problems"
      - "Shopify Editions theme developers"
    limit: 8
    read_full: true               # đọc toàn văn kết quả qua Jina Reader
    drop_undated: true            # trang không rõ ngày đăng thì bỏ

  - id: google-alerts
    name: Google Alerts
    type: rss
    kind: web
    urls: []                      # dán URL RSS của Google Alerts vào đây
    media_type: article

  - id: hackernews
    name: Hacker News
    type: hackernews
    kind: web
    queries: ["shopify"]
    limit: 20
