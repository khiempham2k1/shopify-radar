# Shopify Radar — chạy trên server nội bộ:  docker compose up -d --build
# Dashboard: http://<server>:3000 (API và Postgres chỉ mở trong mạng nội bộ của compose)
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: radar
      POSTGRES_USER: radar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?đặt POSTGRES_PASSWORD trong .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radar -d radar"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build: {context: ., dockerfile: docker/Dockerfile}
    command: sh -c "radar migrate && uvicorn api.main:app --host 0.0.0.0 --port 8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://radar:${POSTGRES_PASSWORD}@postgres:5432/radar
    depends_on:
      postgres: {condition: service_healthy}
    restart: unless-stopped

  worker:
    build: {context: ., dockerfile: docker/Dockerfile}
    command: sh -c "radar migrate && radar doctor; radar scheduler"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://radar:${POSTGRES_PASSWORD}@postgres:5432/radar
      # discord-cli keeps its message store here, so each run only fetches new messages
      XDG_DATA_HOME: /data/xdg
    volumes:
      - workdata:/data
      # Cookie của tài khoản Reddit riêng cho radar (credential.json của rdt-cli)
      - ./secrets/rdt-cli:/root/.config/rdt-cli
    depends_on:
      postgres: {condition: service_healthy}
    restart: unless-stopped

  web:
    build: {context: ./web}
    env_file: .env
    environment:
      RADAR_API_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on: [api]
    restart: unless-stopped

volumes:
  pgdata:
  workdata:
