# Bổ sung cho docker-compose.yml khi chạy trên VPS:
#   - healthcheck và giới hạn dung lượng log cho mọi container;
#   - dashboard mở ở cổng WEB_PORT (mặc định 3000): http://<ip-vps>:<WEB_PORT>.
# Có domain thì thêm deploy/docker-compose.https.yml (Caddy + HTTPS).
# deploy/setup-vps.sh đặt COMPOSE_FILE trong .env, sau đó các lệnh `docker compose ...` dùng đủ các file.

x-logging: &logging
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "5"}

services:
  postgres:
    <<: *logging

  api:
    <<: *logging
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  worker:
    <<: *logging

  web:
    <<: *logging
    ports: !override
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:3000/login"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
