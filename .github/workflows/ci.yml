name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: radar_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Tests (SQLite)
        run: python -m pytest -q
      - name: Tests (Postgres)
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/radar_test
        run: python -m pytest -q
      - name: Migrations apply cleanly
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/radar_test
        run: |
          python - <<'EOF'
          from radar.db import get_engine
          from radar.models import Base
          Base.metadata.drop_all(get_engine())
          EOF
          radar migrate

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
